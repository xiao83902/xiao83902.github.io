<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>金融工具網</title>
  <meta name="description" content="金融工具網">
  <style>
    :root {
      color-scheme: light;
      --paper: #fbfaf7;
      --ink: #161616;
      --subtle: #77736c;
      --line: #d8d3ca;
      --line-dark: #2a2a2a;
      --wash: #f1eee8;
      --white: #ffffff;
      --error: #9f2520;
      --shadow: 0 28px 80px rgba(44, 38, 30, 0.08);
    }

    * { box-sizing: border-box; }

    html { background: var(--paper); }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(22, 22, 22, 0.035) 1px, transparent 1px),
        linear-gradient(180deg, rgba(22, 22, 22, 0.028) 1px, transparent 1px),
        var(--paper);
      background-size: 64px 64px;
      font-family: "Noto Sans TC", "Yu Gothic", "Hiragino Sans", "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    a { color: inherit; }

    .auth,
    .page {
      min-height: 100vh;
      padding: clamp(20px, 4vw, 48px);
    }

    .auth {
      display: grid;
      place-items: center;
    }

    .auth-card {
      width: min(460px, 100%);
      border: 1px solid var(--line-dark);
      background: rgba(251, 250, 247, 0.92);
      box-shadow: var(--shadow);
      padding: clamp(30px, 7vw, 52px);
    }

    .auth-kicker,
    .label-en,
    .service-index,
    .service-path {
      font-family: "Segoe UI", Arial, sans-serif;
      color: var(--subtle);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .auth-card h1 {
      margin: 10px 0 0;
      font-size: clamp(34px, 9vw, 54px);
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .auth-form {
      display: grid;
      gap: 14px;
      margin-top: 34px;
    }

    .auth-form label {
      color: var(--ink);
      font-size: 14px;
      font-weight: 600;
    }

    .auth-form input {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line-dark);
      border-radius: 0;
      padding: 0 14px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.72);
      font: inherit;
      font-size: 17px;
      outline: none;
    }

    .auth-form input:focus {
      box-shadow: inset 0 -3px 0 var(--ink);
    }

    .auth-form button {
      min-height: 52px;
      border: 1px solid var(--line-dark);
      border-radius: 0;
      color: var(--white);
      background: var(--ink);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 180ms ease, color 180ms ease;
    }

    .auth-form button:hover {
      color: var(--ink);
      background: var(--white);
    }

    .auth-error {
      min-height: 22px;
      margin: 0;
      color: var(--error);
      font-size: 14px;
      font-weight: 600;
    }

    .page[hidden],
    .auth[hidden] { display: none; }

    .shell {
      width: min(1180px, 100%);
      min-height: calc(100vh - clamp(40px, 8vw, 96px));
      margin: 0 auto;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(34px, 6vw, 76px);
    }

    .masthead {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 24px;
      border-top: 1px solid var(--line-dark);
      padding-top: 20px;
    }

    .title-block {
      display: grid;
      gap: 18px;
    }

    .label-en { color: var(--ink); }

    .site-title {
      margin: 0;
      font-size: clamp(58px, 11vw, 148px);
      font-weight: 500;
      line-height: 0.96;
      letter-spacing: 0;
    }

    .stamp {
      width: clamp(74px, 12vw, 108px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-dark);
      background: rgba(255, 255, 255, 0.38);
      font-family: "Yu Mincho", "Noto Serif TC", serif;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 600;
      writing-mode: vertical-rl;
    }

    .content {
      display: grid;
      grid-template-columns: minmax(190px, 0.34fr) minmax(0, 1fr);
      gap: clamp(28px, 6vw, 72px);
      align-items: start;
    }

    .side-label {
      position: sticky;
      top: 32px;
      display: grid;
      gap: 18px;
      border-top: 1px solid var(--line-dark);
      padding-top: 18px;
    }

    .side-label h2 {
      margin: 0;
      font-size: clamp(24px, 3vw, 34px);
      font-weight: 500;
      line-height: 1.2;
    }

    .service-list {
      border-top: 1px solid var(--line-dark);
      background: rgba(251, 250, 247, 0.66);
      box-shadow: var(--shadow);
    }

    .service-link {
      min-height: 132px;
      display: grid;
      grid-template-columns: 72px minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(16px, 4vw, 42px);
      border-bottom: 1px solid var(--line-dark);
      padding: clamp(20px, 4.5vw, 34px) clamp(18px, 5vw, 42px);
      text-decoration: none;
      background: rgba(255, 255, 255, 0.42);
      transition: background 180ms ease, padding-left 180ms ease;
    }

    .service-link:hover,
    .service-link:focus-visible {
      background: var(--white);
      padding-left: clamp(24px, 5.6vw, 54px);
      outline: none;
    }

    .service-index {
      color: var(--ink);
      font-size: 13px;
    }

    .service-name {
      margin: 0;
      font-size: clamp(25px, 4.5vw, 44px);
      font-weight: 500;
      line-height: 1.1;
    }

    .service-path {
      justify-self: end;
      color: var(--subtle);
      white-space: nowrap;
    }

    .arrow {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line-dark);
      margin-left: 18px;
      font-size: 20px;
    }

    @media (max-width: 820px) {
      .masthead {
        grid-template-columns: 1fr;
      }

      .stamp {
        justify-self: end;
      }

      .content {
        grid-template-columns: 1fr;
      }

      .side-label {
        position: static;
      }
    }

    @media (max-width: 620px) {
      .auth,
      .page {
        padding: 18px;
      }

      .shell {
        gap: 42px;
      }

      .masthead {
        padding-top: 16px;
      }

      .site-title {
        font-size: clamp(48px, 17vw, 76px);
      }

      .stamp {
        width: 72px;
        font-size: 24px;
      }

      .service-link {
        min-height: 124px;
        grid-template-columns: 1fr auto;
        gap: 12px 18px;
        padding: 22px 18px;
      }

      .service-index {
        grid-column: 1 / -1;
      }

      .service-name {
        font-size: 28px;
      }

      .service-path {
        display: none;
      }

      .arrow {
        width: 38px;
        height: 38px;
        margin-left: 0;
      }
    }

    @media (max-width: 380px) {
      .auth-card {
        padding: 24px 20px;
      }

      .service-link {
        grid-template-columns: 1fr;
      }

      .arrow {
        justify-self: end;
      }
    }
  </style>
</head>
<body>
  <section class="auth" id="auth" aria-labelledby="auth-title">
    <div class="auth-card">
      <div class="auth-kicker">PRIVATE ACCESS</div>
      <h1 id="auth-title">金融工具網</h1>
      <form class="auth-form" id="auth-form">
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" inputmode="text" required>
        <button type="submit">進入</button>
        <p class="auth-error" id="auth-error" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <main class="page" id="app" hidden>
    <div class="shell">
      <header class="masthead" aria-labelledby="site-title">
        <div class="title-block">
          <div class="label-en">FINANCIAL TOOLS</div>
          <h1 class="site-title" id="site-title">金融工具網</h1>
        </div>
        <div class="stamp" aria-hidden="true">金融</div>
      </header>

      <section class="content" aria-labelledby="service-title">
        <div class="side-label">
          <div class="label-en">SERVICE</div>
          <h2 id="service-title">服務中心</h2>
        </div>

        <nav class="service-list" aria-label="服務入口">
          <a class="service-link" href="/loan">
            <span class="service-index">01</span>
            <span class="service-name">貸款工具</span>
            <span class="service-path">/loan</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
          <a class="service-link" href="/bankcode">
            <span class="service-index">02</span>
            <span class="service-name">銀行代碼查詢</span>
            <span class="service-path">/bankcode</span>
            <span class="arrow" aria-hidden="true">→</span>
          </a>
        </nav>
      </section>
    </div>
  </main>

  <script>
    const PASSWORD = '0902';
    const STORAGE_KEY = '0902-one-authenticated';
    const auth = document.getElementById('auth');
    const app = document.getElementById('app');
    const form = document.getElementById('auth-form');
    const password = document.getElementById('password');
    const error = document.getElementById('auth-error');

    function unlock() {
      auth.hidden = true;
      app.hidden = false;
    }

    if (sessionStorage.getItem(STORAGE_KEY) === 'true') {
      unlock();
    } else {
      password.focus();
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (password.value === PASSWORD) {
        sessionStorage.setItem(STORAGE_KEY, 'true');
        error.textContent = '';
        unlock();
        return;
      }

      error.textContent = '密碼錯誤';
      password.value = '';
      password.focus();
    });
  </script>
</body>
</html>
