<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>0902.one</title>
  <meta name="description" content="0902.one 工具入口">
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f6f8;
      --surface-2: #f9fbfc;
      --text: #16202a;
      --muted: #637083;
      --line: #dce3ea;
      --accent: #0f766e;
      --accent-dark: #115e59;
      --accent-soft: #e7f5f2;
      --gold: #b7791f;
      --gold-soft: #fff4dd;
      --shadow: 0 22px 70px rgba(22, 32, 42, 0.11);
      --soft-shadow: 0 14px 36px rgba(22, 32, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(115deg, rgba(15, 118, 110, 0.10), transparent 34%),
        linear-gradient(245deg, rgba(183, 121, 31, 0.10), transparent 30%),
        var(--bg);
      color: var(--text);
    }

    a { color: inherit; }

    .page {
      min-height: 100vh;
      padding: 28px;
    }

    .shell {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 22px;
    }

    .topbar {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 0 4px;
    }

    .mark {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      font-weight: 850;
      font-size: 20px;
      letter-spacing: 0;
    }

    .mark-symbol {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #ffffff;
      background: linear-gradient(135deg, var(--accent), #1f8a70);
      box-shadow: 0 10px 24px rgba(15, 118, 110, 0.22);
      font-size: 15px;
    }

    .status-pill {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(99, 112, 131, 0.22);
      border-radius: 8px;
      padding: 0 13px;
      color: #166534;
      background: rgba(255, 255, 255, 0.72);
      font-size: 14px;
      font-weight: 800;
      backdrop-filter: blur(10px);
    }

    .status-pill::before,
    .live::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: #22c55e;
      box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.14);
    }

    .hero {
      min-height: 540px;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr);
      gap: 28px;
      align-items: stretch;
    }

    .intro-card,
    .command-card,
    .tool-card,
    .metric {
      border: 1px solid rgba(220, 227, 234, 0.95);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .intro-card {
      position: relative;
      overflow: hidden;
      padding: clamp(34px, 6vw, 62px);
      display: grid;
      align-content: space-between;
      gap: 34px;
    }

    .intro-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(15, 118, 110, 0.13), transparent 44%),
        repeating-linear-gradient(90deg, rgba(22, 32, 42, 0.055) 0 1px, transparent 1px 72px),
        repeating-linear-gradient(0deg, rgba(22, 32, 42, 0.045) 0 1px, transparent 1px 72px);
      pointer-events: none;
    }

    .intro-content,
    .hero-footer {
      position: relative;
      z-index: 1;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent-dark);
      font-size: 13px;
      font-weight: 850;
      letter-spacing: 0;
    }

    h1 {
      margin: 0;
      max-width: 680px;
      font-size: clamp(46px, 7vw, 86px);
      line-height: 0.98;
      letter-spacing: 0;
    }

    .lead {
      margin: 22px 0 0;
      max-width: 600px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.8;
    }

    .hero-footer {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .metric {
      box-shadow: none;
      padding: 16px;
      background: rgba(255, 255, 255, 0.72);
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
      font-weight: 750;
    }

    .metric strong {
      display: block;
      margin-top: 6px;
      font-size: 19px;
      letter-spacing: 0;
    }

    .side {
      display: grid;
      gap: 18px;
    }

    .command-card {
      padding: 22px;
      display: grid;
      gap: 14px;
    }

    .command-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .command-head h2 {
      margin: 0;
      font-size: 20px;
      letter-spacing: 0;
    }

    .live {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #166534;
      font-size: 13px;
      font-weight: 850;
    }

    .tool-grid {
      display: grid;
      gap: 14px;
    }

    .tool-card {
      padding: 20px;
      display: grid;
      gap: 16px;
      text-decoration: none;
      box-shadow: var(--soft-shadow);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .tool-card:hover {
      transform: translateY(-3px);
      border-color: rgba(15, 118, 110, 0.45);
      box-shadow: 0 22px 48px rgba(22, 32, 42, 0.12);
    }

    .tool-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
    }

    .tool-icon {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-weight: 900;
      font-size: 18px;
    }

    .tool-card:nth-child(2) .tool-icon {
      background: var(--gold-soft);
      color: var(--gold);
    }

    .tool-card h3 {
      margin: 0;
      font-size: 21px;
      letter-spacing: 0;
    }

    .tool-card p {
      margin: 7px 0 0;
      color: var(--muted);
      line-height: 1.65;
    }

    .tool-path {
      align-self: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 9px;
      color: var(--muted);
      background: var(--surface-2);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
    }

    .tool-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid var(--line);
      padding-top: 14px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    @media (max-width: 920px) {
      .page { padding: 20px; }
      .hero { grid-template-columns: 1fr; min-height: auto; }
      .side { grid-template-columns: 1fr; }
    }

    @media (max-width: 640px) {
      .topbar { align-items: flex-start; flex-direction: column; }
      .status-pill { width: 100%; justify-content: center; }
      .intro-card { padding: 28px; }
      .hero-footer { grid-template-columns: 1fr; }
      .tool-top { display: grid; }
      .tool-path { justify-self: start; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="shell">
      <header class="topbar" aria-label="網站狀態">
        <div class="mark" aria-label="0902.one">
          <span class="mark-symbol">09</span>
          <span>0902.one</span>
        </div>
        <div class="status-pill">Online</div>
      </header>

      <section class="hero" aria-labelledby="site-title">
        <div class="intro-card">
          <div class="intro-content">
            <p class="eyebrow">TOOLS DASHBOARD</p>
            <h1 id="site-title">你的金融工具入口</h1>
            <p class="lead">把常用查詢與計算服務集中在同一個乾淨入口。每個服務只保留一個明確入口，降低選擇成本，也讓操作更一致。</p>
          </div>
          <div class="hero-footer" aria-label="網站摘要">
            <div class="metric"><span>主網域</span><strong>0902.one</strong></div>
            <div class="metric"><span>工具數</span><strong>2</strong></div>
            <div class="metric"><span>狀態</span><strong>已上線</strong></div>
          </div>
        </div>

        <aside class="side" aria-label="工具清單">
          <div class="command-card">
            <div class="command-head">
              <h2>服務中心</h2>
              <span class="live">Online</span>
            </div>
            <div class="tool-grid">
              <a class="tool-card" href="/loan">
                <div class="tool-top">
                  <div>
                    <div class="tool-icon">貸</div>
                    <h3>貸款工具</h3>
                    <p>銀行貸款自動計算系統，快速整理本金、利率與還款資訊。</p>
                  </div>
                  <span class="tool-path">/loan</span>
                </div>
                <div class="tool-meta"><span>Loan Calculator</span><span>進入服務</span></div>
              </a>

              <a class="tool-card" href="/bankcode">
                <div class="tool-top">
                  <div>
                    <div class="tool-icon">行</div>
                    <h3>銀行代碼查詢</h3>
                    <p>臺灣金融機構分行代碼查詢，適合快速查找銀行與分行資料。</p>
                  </div>
                  <span class="tool-path">/bankcode</span>
                </div>
                <div class="tool-meta"><span>Bank Code Lookup</span><span>進入服務</span></div>
              </a>
            </div>
          </div>
        </aside>
      </section>
    </div>
  </main>
</body>
</html>
