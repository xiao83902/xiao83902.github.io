<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>金融工具網</title>
  <meta name="description" content="金融工具網">
  <style>
    :root {
      color-scheme: light;
      --ink: #16314f;
      --muted: #5f7b98;
      --blue: #4f9dff;
      --blue-deep: #1f6fca;
      --blue-soft: #e8f5ff;
      --white: #ffffff;
      --line: rgba(103, 154, 207, 0.28);
      --glass: rgba(255, 255, 255, 0.62);
      --error: #b42318;
      --shadow: 0 28px 90px rgba(66, 129, 196, 0.18);
    }

    * { box-sizing: border-box; }

    html { background: #eef8ff; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 12%, rgba(143, 207, 255, 0.62), transparent 34%),
        radial-gradient(circle at 88% 18%, rgba(214, 239, 255, 0.82), transparent 30%),
        linear-gradient(135deg, #f9fdff 0%, #eef8ff 45%, #ffffff 100%);
      font-family: "LINE Seed TW", "LINE Seed Sans TW", "LINE Seed Sans TC", "Microsoft JhengHei", "微軟正黑體", Arial, sans-serif;
      letter-spacing: 0;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(79, 157, 255, 0.08) 1px, transparent 1px),
        linear-gradient(180deg, rgba(79, 157, 255, 0.07) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: linear-gradient(to bottom, black, transparent 78%);
      pointer-events: none;
    }

    a { color: inherit; }

    .auth,
    .page {
      position: relative;
      min-height: 100vh;
      padding: clamp(18px, 4vw, 48px);
    }

    .auth {
      display: grid;
      place-items: center;
    }

    .auth-card,
    .hero-panel,
    .service-link {
      border: 1px solid var(--line);
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .auth-card {
      width: min(460px, 100%);
      border-radius: 28px;
      padding: clamp(28px, 7vw, 48px);
    }

    .auth-kicker {
      color: var(--blue-deep);
      font-size: 6px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .auth-card h1 {
      margin: 12px 0 0;
      font-size: clamp(17px, 4.5vw, 26px);
      font-weight: 700;
      line-height: 1.12;
    }

    .auth-form {
      display: grid;
      gap: 14px;
      margin-top: 32px;
    }

    .auth-form label {
      color: var(--ink);
      font-size: 7px;
      font-weight: 700;
    }

    .auth-form input {
      width: 100%;
      min-height: 52px;
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 0 16px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.76);
      font: inherit;
      font-size: 8.5px;
      outline: none;
    }

    .auth-form input:focus {
      border-color: rgba(31, 111, 202, 0.58);
      box-shadow: 0 0 0 5px rgba(79, 157, 255, 0.14);
    }

    .auth-form button {
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      color: var(--white);
      background: linear-gradient(135deg, var(--blue), var(--blue-deep));
      font: inherit;
      font-size: 7.5px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .auth-form button:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 34px rgba(31, 111, 202, 0.22);
    }

    .auth-error {
      min-height: 22px;
      margin: 0;
      color: var(--error);
      font-size: 7px;
      font-weight: 700;
    }

    .page[hidden],
    .auth[hidden] { display: none; }

    .shell {
      width: min(1080px, 100%);
      min-height: calc(100vh - clamp(36px, 8vw, 96px));
      margin: 0 auto;
      display: grid;
      align-content: center;
      gap: clamp(28px, 5vw, 48px);
    }

    .hero-panel {
      position: relative;
      overflow: hidden;
      border-radius: 34px;
      padding: clamp(30px, 7vw, 72px);
    }

    .hero-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.72), transparent 42%),
        radial-gradient(circle at 84% 20%, rgba(79, 157, 255, 0.16), transparent 30%);
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      display: grid;
      gap: clamp(34px, 5vw, 58px);
    }

    .title-row {
      display: grid;
      gap: 14px;
    }

    .label {
      color: var(--blue-deep);
      font-size: 6.5px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .site-title {
      margin: 0;
      font-size: clamp(24px, 4.5vw, 56px);
      font-weight: 700;
      line-height: 1;
    }

    .service-list {
      display: grid;
      gap: 18px;
    }

    .service-link {
      min-height: 112px;
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr) auto;
      align-items: center;
      gap: clamp(16px, 4vw, 34px);
      border-radius: 24px;
      padding: clamp(18px, 4vw, 30px);
      text-decoration: none;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease, box-shadow 180ms ease;
    }

    .service-link:hover,
    .service-link:focus-visible {
      transform: translateY(-3px);
      border-color: rgba(31, 111, 202, 0.42);
      background: rgba(255, 255, 255, 0.78);
      box-shadow: 0 24px 64px rgba(66, 129, 196, 0.20);
      outline: none;
    }

    .service-index {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      color: var(--blue-deep);
      background: var(--blue-soft);
      font-size: 7px;
      font-weight: 800;
    }

    .service-name {
      font-size: clamp(12px, 2vw, 20px);
      font-weight: 700;
      line-height: 1.15;
    }

    .arrow {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      color: var(--white);
      background: linear-gradient(135deg, var(--blue), var(--blue-deep));
      font-size: 10.5px;
      font-weight: 700;
    }

    @media (max-width: 720px) {
      .shell {
        align-content: start;
        padding-top: 6vh;
      }

      .hero-panel {
        border-radius: 28px;
      }

      .service-link {
        grid-template-columns: 52px minmax(0, 1fr) 40px;
        min-height: 96px;
        border-radius: 22px;
      }

      .service-index {
        width: 44px;
        height: 44px;
        border-radius: 15px;
      }

      .arrow {
        width: 38px;
        height: 38px;
        border-radius: 14px;
      }
    }

    @media (max-width: 480px) {
      .auth,
      .page {
        padding: 14px;
      }

      .auth-card,
      .hero-panel {
        border-radius: 24px;
      }

      .site-title {
        font-size: clamp(21px, 8vw, 33px);
      }

      .service-list {
        gap: 14px;
      }

      .service-link {
        grid-template-columns: 1fr auto;
        gap: 14px;
        padding: 20px;
      }

      .service-index {
        grid-column: 1 / -1;
      }

      .service-name {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <section class="auth" id="auth" aria-labelledby="auth-title">
    <div class="auth-card">
      <div class="auth-kicker">PRIVATE ACCESS</div>
      <h1 id="auth-title">金融工具網</h1>
      <form class="auth-form" id="auth-form">
        <label for="password">密碼</label>
        <input id="password" name="password" type="password" autocomplete="current-password" inputmode="text" required>
        <button type="submit">進入</button>
        <p class="auth-error" id="auth-error" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <main class="page" id="app" hidden>
    <div class="shell">
      <section class="hero-panel" aria-labelledby="site-title">
        <div class="hero-inner">
          <div class="title-row">
            <div class="label">FINANCIAL TOOLS</div>
            <h1 class="site-title" id="site-title">金融工具網</h1>
          </div>

          <nav class="service-list" aria-label="服務入口">
            <a class="service-link" href="/loan">
              <span class="service-index">01</span>
              <span class="service-name">貸款工具</span>
              <span class="arrow" aria-hidden="true">→</span>
            </a>
            <a class="service-link" href="/bankcode">
              <span class="service-index">02</span>
              <span class="service-name">銀行代碼查詢</span>
              <span class="arrow" aria-hidden="true">→</span>
            </a>
          </nav>
        </div>
      </section>
    </div>
  </main>

  <script>
    const PASSWORD = '0902';
    const STORAGE_KEY = '0902-one-authenticated';
    const auth = document.getElementById('auth');
    const app = document.getElementById('app');
    const form = document.getElementById('auth-form');
    const password = document.getElementById('password');
    const error = document.getElementById('auth-error');

    function unlock() {
      auth.hidden = true;
      app.hidden = false;
    }

    if (sessionStorage.getItem(STORAGE_KEY) === 'true') {
      unlock();
    } else {
      password.focus();
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      if (password.value === PASSWORD) {
        sessionStorage.setItem(STORAGE_KEY, 'true');
        error.textContent = '';
        unlock();
        return;
      }

      error.textContent = '密碼錯誤';
      password.value = '';
      password.focus();
    });
  </script>
</body>
</html>
